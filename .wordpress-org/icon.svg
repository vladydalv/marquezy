<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDEEF3"/>
      <stop offset="1" stop-color="#F8D3DE"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-60%" width="140%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5B2A4E" flood-opacity="0.28"/>
    </filter>
    <symbol id="star" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></symbol>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <!-- plum ribbon (back) -->
  <g transform="rotate(16 128 128)" filter="url(#sh)">
    <rect x="-60" y="102" width="376" height="52" fill="#5B2A4E"/>
    <g fill="#FCE4EC">
      <rect x="-14" y="123" width="44" height="10" rx="5"/>
      <use href="#star" x="42" y="119" width="18" height="18"/>
      <rect x="72" y="123" width="62" height="10" rx="5"/>
      <use href="#star" x="146" y="119" width="18" height="18"/>
      <rect x="176" y="123" width="50" height="10" rx="5"/>
      <use href="#star" x="238" y="119" width="18" height="18"/>
    </g>
  </g>
  <!-- rose ribbon (front) -->
  <g transform="rotate(-16 128 128)" filter="url(#sh)">
    <rect x="-60" y="102" width="376" height="52" fill="#F06A8F"/>
    <g fill="#FFFFFF">
      <rect x="0" y="123" width="56" height="10" rx="5"/>
      <use href="#star" x="68" y="119" width="18" height="18"/>
      <rect x="98" y="123" width="48" height="10" rx="5"/>
      <use href="#star" x="158" y="119" width="18" height="18"/>
      <rect x="188" y="123" width="60" height="10" rx="5"/>
    </g>
  </g>
</svg>
